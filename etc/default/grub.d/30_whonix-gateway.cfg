## (TM) unicode sign unsupported.
GRUB_DISTRIBUTOR="Whonix-Gateway"

## Theme and resolution.
##
## During a derivative-maker build 'dist_build_grub_bios_theme=true' forces the
## 4x3/BIOS variant, so the image is reproducible regardless of build-host
## firmware.
##
## 4x3 is the build default because Whonix's primary use case is BIOS VMs,
## whose VESA modes only provide a 4x3 canvas.

GRUB_THEME="/boot/grub/themes/whonix-gateway/theme.txt"
rm -f /boot/grub/themes/whonix-gateway/background.png
rm -f /boot/grub/themes/whonix-gateway/theme.txt
if [ "${dist_build_grub_bios_theme:-}" != "true" ] && [ -d /sys/firmware/efi ]; then
   ## Can't use "ln" here, /boot may be a FAT32 partition.
   cp -- /boot/grub/themes/whonix-gateway/background-16x9.png /boot/grub/themes/whonix-gateway/background.png
   cp -- /boot/grub/themes/whonix-gateway/theme-16x9.txt /boot/grub/themes/whonix-gateway/theme.txt
   GRUB_GFXMODE="1280x720,auto"
else
   cp -- /boot/grub/themes/whonix-gateway/background-4x3.png /boot/grub/themes/whonix-gateway/background.png
   cp -- /boot/grub/themes/whonix-gateway/theme-4x3.txt /boot/grub/themes/whonix-gateway/theme.txt
   GRUB_GFXMODE="1024x768,auto"
fi
